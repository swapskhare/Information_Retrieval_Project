<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot with Visualizations</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdn.jsdelivr.net 'unsafe-eval';">
    <link rel="stylesheet" href="/static/tailwind.css">
    <!-- Include Chart.js for Visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans h-screen overflow-hidden">

    <!-- Main Flex Container -->
    <div class="flex h-full">

        <!-- Left Sidebar (Topics) -->
        <div class="w-1/5 bg-gray-800 p-4 flex flex-col">
            <h2 class="text-lg font-semibold mb-4">Select Topic</h2>
            <div id="topics-container" class="flex flex-col space-y-2">
                <!-- Buttons dynamically injected by script.js -->
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="flex-1 flex flex-col p-6">
            <h1 class="text-2xl font-bold mb-4">Chatbot</h1>
            <div id="chatOutput" class="flex-1 bg-gray-800 rounded p-4 overflow-y-auto mb-4">
                <!-- Chat messages will appear here -->
            </div>
            <div class="flex items-center space-x-2">
                <input type="text" id="userInput" 
                       class="flex-1 p-2 rounded-l bg-gray-700 border border-gray-600 
                              focus:outline-none focus:ring-2 focus:ring-blue-500" 
                       placeholder="Type a message..." 
                       onkeypress="checkEnter(event)">
                <button onclick="sendMessage()" 
                        class="bg-blue-600 p-2 rounded-r hover:bg-blue-500">Send</button>
            </div>
            <!-- Loading Spinner -->
            <div id="loadingSpinner" class="hidden mt-2 flex justify-center">
                <div class="spinner"></div>
            </div>
        </div>


    <!-- Include JavaScript -->
    <script src="/static/script.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>

</body>
</html>
