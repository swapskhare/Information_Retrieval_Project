<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot UI</title>
    <link rel="stylesheet" href="/static/tailwind.css">
</head>
<body class="bg-gray-900 text-white font-sans h-screen overflow-hidden">

    <!-- Main Flex Container -->
    <div class="flex h-full">

        <!-- Left Sidebar (Topics) -->
        <div class="w-1/5 bg-gray-800 p-4 flex flex-col">
            <h2 class="text-lg font-semibold mb-4">Select Topic</h2>
            <div id="topics-container" class="flex flex-col space-y-2">
                <!-- Buttons will be dynamically injected here by JavaScript -->
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="flex-1 flex flex-col p-6">
            <h1 class="text-2xl font-bold mb-4">Chatbot</h1>
            <div id="chatOutput" class="flex-1 bg-gray-800 rounded p-4 overflow-y-auto mb-4">
                <!-- Chat messages will appear here -->
            </div>
            <div class="flex">
                <input type="text" id="userInput" class="flex-1 p-2 rounded-l bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Type a message..." onkeypress="checkEnter(event)">
                <button onclick="sendMessage()" class="bg-blue-600 p-2 rounded-r hover:bg-blue-500">Send</button>
            </div>
        </div>

        <!-- Right Sidebar (Visualizations) -->
        <div class="w-1/5 bg-gray-800 p-4 flex flex-col">
            <h2 class="text-lg font-semibold mb-4">Visualizations</h2>
            <div class="flex flex-col space-y-4">
                <div class="bg-gray-700 p-4 rounded">Visualization 1</div>
                <div class="bg-gray-700 p-4 rounded">Visualization 2</div>
                <div class="bg-gray-700 p-4 rounded">Visualization 3</div>
            </div>
        </div>

    </div>

    <script src="/static/script.js"></script>
</body>
</html>
