version: 0.2

# Buildspec for CodeBuild project to generate data files and upload to S3
# This buildspec runs: scraper.py, indexer.py, doc_mapper.py
# and uploads the generated JSON files to S3

env:
  variables:
    # S3 bucket name - should be set in CodeBuild project environment variables
    # S3_BUCKET: "ir-chatbot-data-123456789"
    S3_DATA_PREFIX: "data/"
    PYTHONUNBUFFERED: "1"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Starting data pipeline build..."
      - echo "Python version:"
      - python --version
      - echo "Installing system dependencies..."
      - apt-get update -y
      - apt-get install -y curl
      - echo "Upgrading pip..."
      - pip install --upgrade pip setuptools wheel
      - echo "Installing Python dependencies..."
      - pip install -r requirements.txt
      - echo "Downloading NLTK stopwords..."
      - python -m nltk.downloader stopwords

  pre_build:
    commands:
      - echo "Creating data directory..."
      - mkdir -p data
      - echo "Data directory created"
      - echo "S3 Bucket: $S3_BUCKET"
      - echo "S3 Data Prefix: $S3_DATA_PREFIX"

  build:
    commands:
      - echo "=========================================="
      - echo "Phase 1: Running Wikipedia Scraper"
      - echo "=========================================="
      - echo "This may take 6-12 hours depending on connection speed..."
      - python scraper.py
      - test -f "data/all_topics_wikipedia_data.json"
      - echo "Scraper completed successfully"
      - echo "=========================================="
      - echo "Phase 2: Building Inverted Index"
      - echo "=========================================="
      - python indexer.py
      - test -f "data/postings_list.json"
      - echo "Indexer completed successfully"
      - echo "=========================================="
      - echo "Phase 3: Creating Document Mapping"
      - echo "=========================================="
      - python doc_mapper.py
      - test -f "data/doc_id_to_url.json"
      - echo "Document mapper completed successfully"
      - echo "Verifying generated files..."
      - ls -lh data/*.json
      - echo "All data files generated successfully"

  post_build:
    commands:
      - echo "=========================================="
      - echo "Phase 4: Uploading Files to S3"
      - echo "=========================================="
      - echo "Uploading data files to s3://$S3_BUCKET/$S3_DATA_PREFIX"
      - aws s3 cp data/all_topics_wikipedia_data.json s3://$S3_BUCKET/$S3_DATA_PREFIXall_topics_wikipedia_data.json
      - aws s3 cp data/postings_list.json s3://$S3_BUCKET/$S3_DATA_PREFIXpostings_list.json
      - aws s3 cp data/doc_id_to_url.json s3://$S3_BUCKET/$S3_DATA_PREFIXdoc_id_to_url.json
      - echo "All files uploaded to S3 successfully"
      - echo "Summary:"
      - echo "  - all_topics_wikipedia_data.json uploaded to S3"
      - echo "  - postings_list.json uploaded to S3"
      - echo "  - doc_id_to_url.json uploaded to S3"
      - echo "Data pipeline completed successfully!"

# CloudWatch Logs configuration (set in CodeBuild project)
# logs:
#   cloudwatch-logs:
#     group-name: "/aws/codebuild/ir-chatbot-data-pipeline"
#     stream-name: "build-log"

