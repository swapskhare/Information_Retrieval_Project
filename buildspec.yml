version: 0.2

# Buildspec for CodeBuild project to generate data files and upload to S3
env:
  variables:
    S3_DATA_PREFIX: data/
    PYTHONUNBUFFERED: "1"
    ARTICLES_PER_TOPIC: "600"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Starting data pipeline build..."
      - python --version
      - apt-get update -y
      - apt-get install -y curl
      - pip install --upgrade pip setuptools wheel
      - pip install -r requirements.txt
      - python -m nltk.downloader stopwords

  pre_build:
    commands:
      - mkdir -p data
      - test -n "$S3_BUCKET" || (echo "ERROR S3_BUCKET not set" && exit 1)
      - echo "S3 Bucket - $S3_BUCKET"
      - echo "Articles per topic - $ARTICLES_PER_TOPIC"

  build:
    commands:
      - echo "Phase 1 - Running Wikipedia Scraper"
      - echo "Scraping $ARTICLES_PER_TOPIC articles per topic"
      - python scraper.py
      - test -f data/all_topics_wikipedia_data.json || (echo "Scraper failed" && exit 1)
      - echo "Phase 2 - Building Inverted Index"
      - python indexer.py
      - test -f data/postings_list.json || (echo "Indexer failed" && exit 1)
      - echo "Phase 3 - Creating Document Mapping"
      - python doc_mapper.py
      - test -f data/doc_id_to_url.json || (echo "Mapper failed" && exit 1)
      - ls -lh data/*.json

  post_build:
    commands:
      - echo "Phase 4 - Uploading to S3"
      - aws s3 cp data/all_topics_wikipedia_data.json s3://$S3_BUCKET/${S3_DATA_PREFIX}all_topics_wikipedia_data.json
      - aws s3 cp data/postings_list.json s3://$S3_BUCKET/${S3_DATA_PREFIX}postings_list.json
      - aws s3 cp data/doc_id_to_url.json s3://$S3_BUCKET/${S3_DATA_PREFIX}doc_id_to_url.json
      - echo "Upload complete"
